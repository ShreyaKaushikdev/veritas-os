        '200':
          description: ''
      tags: *ref_1
  /judging/ballots:
    get:
      operationId: JudgingMongoController_getBallots
      summary: Fetch all judge ballots from MongoDB
      parameters:
        - name: projectId
          required: true
          in: query
          schema:
            type: string
        - name: judgeId
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: &ref_2
        - Live Judging & Ballots
    post:
      operationId: JudgingMongoController_submitLiveBallot
      summary: >-
        Record a live signed judge ballot into MongoDB with cryptographic
        receipt
      parameters: []
      responses:
        '201':
          description: ''
      tags: *ref_2
