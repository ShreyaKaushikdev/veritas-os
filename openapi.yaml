openapi: 3.0.0
paths:
  /database/status:
    get:
      operationId: DatabaseController_getStatus
      summary: Get live MongoDB connection status & collection statistics
      parameters: []
      responses:
        '200':
          description: ''
      tags: &ref_0
        - Database & Telemetry
  /database/clear:
    post:
      operationId: DatabaseController_clear
      summary: >-
        Clear all mock and seeded data to run purely on live participant and
        judge records
      parameters: []
      responses:
        '201':
          description: ''
      tags: *ref_0
  /database/reseed:
    post:
      operationId: DatabaseController_reseed
      summary: 'Sandbox Only: Populate demo hackathon state'
      parameters: []
      responses:
        '201':
          description: ''
      tags: *ref_0
  /dashboard/stats:
    get:
      operationId: DashboardController_getStats
      summary: >-
        Fetch live executive dashboard telemetry calculated directly from
        MongoDB
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Command Dashboard
  /projects:
    get:
      operationId: ProjectsMongoController_getProjects
      summary: >-
        Fetch all hackathon projects from MongoDB with search, track filter, and
        sorting
      parameters:
        - name: track
          required: false
          in: query
          description: Filter by competitive track
          schema:
            type: string
        - name: search
          required: false
          in: query
          description: Filter by project title or keyword
          schema:
            type: string
        - name: sort
          required: false
          in: query
          description: Sort criteria
          schema:
            enum:
              - rank
              - elo
              - title
            type: string
      responses:
        '200':
          description: ''
      tags: &ref_1
        - Projects (MongoDB)
    post:
      operationId: ProjectsMongoController_createProject
      summary: Submit a new project to MongoDB
      parameters: []
      responses:
        '201':
          description: ''
      tags: *ref_1
  /projects/{id}:
    get:
      operationId: ProjectsMongoController_getProjectById
      summary: Get single project details and assigned ballots from MongoDB
      parameters:
        - name: id
          required: true
          in: path
          description: Project ID (e.g. proj-01)
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *ref_1
  /projects/leaderboard/tracks:
    get:
      operationId: ProjectsMongoController_getTrackLeaderboard
      summary: Aggregated track-by-track leaderboard analytics from MongoDB
      parameters: []
      responses:
        '200':
          description: ''
      tags: *ref_1
  /projects/export/json:
