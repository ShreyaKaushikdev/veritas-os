  /projects:
    get:
      operationId: ProjectsMongoController_getProjects
      summary: >-
        Fetch all hackathon projects from MongoDB with search, track filter, and
        sorting
      parameters:
        - name: track
          required: false
          in: query
          description: Filter by competitive track
          schema:
            type: string
        - name: search
          required: false
          in: query
          description: Filter by project title or keyword
          schema:
            type: string
        - name: sort
          required: false
          in: query
          description: Sort criteria
          schema:
            enum:
              - rank
              - elo
              - title
            type: string
      responses:
        '200':
          description: ''
      tags: &ref_1
        - Projects (MongoDB)
    post:
      operationId: ProjectsMongoController_createProject
      summary: Submit a new project to MongoDB
      parameters: []
      responses:
        '201':
          description: ''
      tags: *ref_1
